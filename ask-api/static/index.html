<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doximity Ask — demo</title>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>Doximity Ask</h1>
        <button id="new-chat" type="button">New conversation</button>
      </div>
    </header>

    <main id="chat" aria-live="polite"></main>

    <form id="composer">
      <div class="composer-inner">
        <div class="composer-hero">
          <h1>Doximity Ask</h1>
          <p>Clinical questions, evidence-based answers with citations.</p>
        </div>
        <div class="composer-row">
          <textarea
            id="question"
            rows="1"
            placeholder="Ask a clinical question…"
            autofocus
          ></textarea>
          <button type="submit" id="send">Ask</button>
        </div>
      </div>
    </form>

    <script src="/app.js?v=2"></script>
  </body>
</html>
