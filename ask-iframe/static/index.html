<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Doximity Ask — iframe demo</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="header-inner">
        <h1>Doximity Ask <span class="subtitle">iframe integration</span></h1>
        <div class="header-actions">
          <button id="launch-blank" type="button" data-variant="blank">Blank chat</button>
          <button id="launch-patient" type="button" data-variant="patient">Patient context</button>
          <button id="launch-prompt" type="button" data-variant="prompt">Chat with prompt</button>
        </div>
      </div>
    </header>

    <div id="error-banner" hidden></div>

    <section id="session-panel" hidden>
      <iframe
        id="ask-frame"
        title="Doximity Ask"
        width="100%"
        frameborder="0">
      </iframe>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
